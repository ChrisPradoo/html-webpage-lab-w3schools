<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W3Schools</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--Learn to code & html section-->



    <!-- Css & JavaScript section-->



    <!-- Python & SQL section -->

    <div id="python-section">

            <!--left side for the flexbox -->
        <div class="left">
            <h1>Python</h1>
            <p>A popular programming language.</p>

            <button id="learn-python">Learn Python</button>
            <button id="python-reference">Python Reference</button>
            <button id="get-certified">Get Certified</button>
        </div>

        <!-- the image, our right side for the flexbox-->
        <div class="right">
            <img src="/images/pythonExample.png" alt="python example">
        </div>

    </div>


    <div id="sql-section">

            <!--left side for the flexbox -->
        <div class="left-sql">
            <h1>SQL</h1>
            <p>A language for accessing databases</p>

            <button id="learn-sql">Learn SQL</button>
            <button id="sql-reference">SQL Reference</button>
            <button id="get-certified-sql">Get Certified</button>
        </div>

        <!-- the image, our right side for the flexbox-->
        <div class="right img sql">
            <img src="/images/sqlExample.png" alt="SQL example">
        </div>
        
    </div>
</body>
</html>
