<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W3Schools</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--Learn to code & html section-->
     <div id="Learn">
    <h1>Learn to Code</h1>
    <h3>With the world's largest web developer site.</h3>
    <img src="images/search-bar.png">
    <br> 
    <a href="https://www.w3schools.com/where_to_start.asp">Not sure Where to Begin?</a>
    </div>

    <div id="HTML">
        <div id="column-1">
            <h1>HTML</h1>
                <h3>The language for building web pages</h3>
                <a href="https://www.w3schools.com/html/default.asp" class="btn html-btn">Learn HTML</a>

                <a href="https://www.w3schools.com/videos/index.php" class="btn video-btn">Video Tutorial</a>

                <a href="https://www.w3schools.com/tags/default.asp" class="btn ref-btn">HTML Reference</a>

                <a href="https://campus.w3schools.com/collections/certifications/products/html-certificate" class="btn cert-btn">Get Certified</a>
            </div>
            <div id="column-2">
                <img src="images/try-it-yourself-ex.png"> 
            </div>

    </div>


    <!-- Css & JavaScript section-->



    <!-- Python & SQL section -->

    <div id="python-section">

            <!--left side for the flexbox -->
        <div class="left">
            <h1>Python</h1>
            <p>A popular programming language.</p>

            <button id="learn-python">Learn Python</button>
            <button id="python-reference">Python Reference</button>
            <button id="get-certified">Get Certified</button>
        </div>

        <!-- the image, our right side for the flexbox-->
        <div class="right">
            <img src="/images/pythonExample.png" alt="python example">
        </div>

    </div>


    <div id="sql-section">

            <!--left side for the flexbox -->
        <div class="left-sql">
            <h1>SQL</h1>
            <p>A language for accessing databases</p>

            <button id="learn-sql">Learn SQL</button>
            <button id="sql-reference">SQL Reference</button>
            <button id="get-certified-sql">Get Certified</button>
        </div>

        <!-- the image, our right side for the flexbox-->
        <div class="right img sql">
            <img src="/images/sqlExample.png" alt="SQL example">
        </div>
        
    </div>
</body>
</html>
